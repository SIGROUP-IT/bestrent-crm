
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BestRent CRM – Noleggi al miglior prezzo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23CC1418'/><text x='16' y='22' font-size='18' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>B</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#F5F5F5;color:#1A1A1A;font-size:14px}
:root{--rosso:#CC1418;--nero:#1A1A1A;--bianco:#FFFFFF;--grigio:#6B7280;--grigio-chiaro:#E5E7EB;--grigio-scuro:#374151;--verde:#059669;--arancio:#D97706;--sfondo:#F5F5F5}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1A1A1A 0%,#2D2D2D 50%,#1A1A1A 100%)}
.login-box{background:var(--bianco);border-radius:16px;padding:32px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{width:240px;margin-bottom:12px;border-radius:8px}
.logo-srl{display:block;font-size:11px;color:var(--grigio);margin-top:4px}
.logo-slogan{font-size:12px;color:var(--grigio);margin-top:2px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--grigio-scuro);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--grigio-chiaro);border-radius:8px;font-size:13px;outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus{border-color:var(--rosso)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--rosso);color:#fff}
.btn-primary:hover{background:#A51015}
.btn-secondary{background:var(--sfondo);color:var(--grigio-scuro);border:1px solid var(--grigio-chiaro)}
.btn-secondary:hover{background:var(--grigio-chiaro)}
.btn-danger{background:#DC2626;color:#fff}
.btn-danger:hover{background:#B91C1C}
.btn-warning{background:var(--arancio);color:#fff}
.btn-warning:hover{background:#B45309}
.btn-sm{padding:6px 12px;font-size:11px;width:auto;display:inline-block}
.error-msg{display:none;background:#FEF2F2;color:#DC2626;padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px}
.error-msg.show{display:block}
.login-hint{font-size:11px;color:var(--grigio);text-align:center;margin-top:12px}
.login-footer{text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--grigio-chiaro)}
.login-footer span{font-size:11px;color:var(--grigio)}
.hidden{display:none!important}
.app{display:none}
.header{background:var(--nero);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.header .brand{display:flex;align-items:center;gap:10px}
.header .brand img{height:36px;border-radius:4px}
.brand-best{font-size:18px;font-weight:800;color:#fff}
.brand-rent{font-size:18px;font-weight:800;color:var(--rosso)}
.brand-srl{font-size:10px;color:var(--grigio);margin-left:4px}
.brand-slogan{font-size:10px;color:var(--grigio);display:block}
.header-right{display:flex;align-items:center;gap:12px}
.user-info{font-size:12px;color:var(--grigio-chiaro)}
.notif-wrapper{position:relative}
.notif-btn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;position:relative;padding:4px 8px}
.notif-badge{position:absolute;top:-2px;right:-2px;background:var(--rosso);color:#fff;font-size:9px;font-weight:700;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.notif-panel{display:none;position:absolute;top:36px;right:0;width:300px;background:var(--bianco);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.15);z-index:50;max-height:400px;overflow-y:auto}
.notif-panel.open{display:block}
.notif-panel h4{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--grigio-chiaro)}
.notif-item{padding:10px 14px;border-bottom:1px solid #f3f4f6;font-size:12px}
.notif-item:hover{background:#f9fafb}
.notif-item.urgent{border-left:3px solid var(--rosso)}
.notif-item.warning{border-left:3px solid var(--arancio)}
.notif-item .ni-title{font-weight:600;color:var(--nero)}
.notif-item .ni-detail{color:var(--grigio);font-size:11px;margin-top:2px}
.notif-empty{padding:20px;text-align:center;color:var(--grigio);font-size:12px}
.nav{display:flex;gap:0;border-bottom:2px solid var(--grigio-chiaro);background:var(--bianco);padding:0 16px;overflow-x:auto;position:sticky;top:56px;z-index:30}
.nav button{padding:12px 16px;border:none;background:none;font-size:12px;font-weight:600;color:var(--grigio);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.nav button.active{color:var(--rosso);border-bottom-color:var(--rosso)}
.nav button:hover{color:var(--nero)}
.content{padding:16px;max-width:1200px;margin:0 auto}
.card{background:var(--bianco);border:1px solid var(--grigio-chiaro);border-radius:12px;padding:18px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:10px 8px;color:var(--grigio);font-size:10px;text-transform:uppercase;border-bottom:2px solid var(--grigio-chiaro)}
td{padding:10px 8px;border-bottom:1px solid #f3f4f6}
tr:hover td{background:#f9fafb}
.status{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600}
.status.attivo{background:#DCFCE7;color:#15803D}
.status.chiuso{background:#FEE2E2;color:#DC2626}
.status.disponibile{background:#DCFCE7;color:#15803D}
.status.noleggiato{background:#FEF3C7;color:#92400E}
.status.manutenzione{background:#FEE2E2;color:#DC2626}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.toolbar .search-box{padding:8px 14px;border:1px solid var(--grigio-chiaro);border-radius:8px;font-size:12px;outline:none;width:250px}
.toolbar .search-box:focus{border-color:var(--rosso)}
.toolbar-btns{display:flex;gap:6px}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:var(--bianco);border-radius:14px;padding:24px;width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-box h3{font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--rosso)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--grigio-chiaro)}
.footer{background:var(--nero);color:var(--grigio);text-align:center;padding:12px;font-size:11px;margin-top:20px}
.alert-card{border:1px solid var(--grigio-chiaro);border-radius:10px;padding:14px;margin-bottom:10px}
.alert-card.warning{border-color:var(--arancio);background:#FFFBEB}
.alert-card.danger{border-color:var(--rosso);background:#FEF2F2}
.alert-card .alert-title{font-weight:600;font-size:13px}
.alert-card .alert-detail{font-size:11px;color:var(--grigio);margin-top:2px}
.print-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200}
.print-box{background:#fff;width:700px;max-height:90vh;overflow-y:auto;border-radius:12px;padding:30px}
.pb-header{text-align:center;border-bottom:2px solid var(--rosso);padding-bottom:14px;margin-bottom:14px}
.pb-title{font-size:16px;font-weight:800;margin-top:8px}
.pb-section{font-size:13px;font-weight:700;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--grigio-chiaro)}
.pb-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.pb-label{font-weight:600;color:var(--grigio-scuro)}
.pb-actions{display:flex;gap:8px;justify-content:center;margin-top:20px}
@media print{.header,.nav,.footer,.pb-actions,.wa-float{display:none!important}.print-overlay{position:static;background:none}.print-box{width:100%;box-shadow:none;border-radius:0}}
@media(max-width:768px){.form-row{grid-template-columns:1fr}.toolbar{flex-direction:column}.toolbar .search-box{width:100%}.pb-grid{grid-template-columns:1fr}.modal-box{width:95%;padding:16px}.login-box{width:95%;padding:20px}}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header h3{margin:0;font-size:14px;font-weight:700}
.cal-nav{display:flex;gap:6px}
.cal-nav button{background:var(--sfondo);border:1px solid var(--grigio-chiaro);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
.cal-nav button:hover{background:var(--grigio-chiaro)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day-header{text-align:center;font-size:10px;font-weight:700;color:var(--grigio);padding:8px 0;text-transform:uppercase}
.cal-day{min-height:80px;background:var(--bianco);border:1px solid #f3f4f6;border-radius:6px;padding:4px;font-size:11px;position:relative}
.cal-day.today{border-color:var(--rosso);background:#FEF2F2}
.cal-day.other-month{opacity:.4}
.cal-day .day-num{font-weight:700;font-size:12px;color:var(--nero);margin-bottom:2px}
.cal-event{padding:2px 4px;border-radius:3px;font-size:9px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-event.consegna{background:#DCFCE7;color:#15803D}
.cal-event.rientro{background:#FEE2E2;color:#CC1418}
.cal-legend{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--grigio)}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.stat-card{background:var(--bianco);border:1px solid var(--grigio-chiaro);border-radius:12px;padding:18px}
.stat-card h4{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--nero)}
.chart-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chart-bar .cb-label{font-size:11px;color:var(--grigio-scuro);width:80px;text-align:right;flex-shrink:0}
.chart-bar .cb-track{flex:1;height:22px;background:#f3f4f6;border-radius:4px;overflow:hidden;position:relative}
.chart-bar .cb-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:10px;font-weight:600;color:#fff;transition:width .5s}
.chart-bar .cb-fill.rosso{background:linear-gradient(90deg,var(--rosso),#E53935)}
.chart-bar .cb-fill.verde{background:linear-gradient(90deg,var(--verde),#10B981)}
.chart-bar .cb-fill.arancio{background:linear-gradient(90deg,var(--arancio),#F59E0B)}
.chart-bar .cb-fill.nero{background:linear-gradient(90deg,var(--nero),#4B5563)}
.chart-bar .cb-fill.grigio{background:linear-gradient(90deg,#6B7280,#9CA3AF)}
.chart-bar .cb-value{font-size:11px;color:var(--grigio);width:60px;text-align:right;flex-shrink:0}
.stat-number{font-size:32px;font-weight:800;color:var(--rosso);text-align:center;margin:10px 0}
.stat-sub{font-size:11px;color:var(--grigio);text-align:center}
.stat-table{width:100%;font-size:11px}
.stat-table td{padding:6px 4px;border-bottom:1px solid #f3f4f6}
.stat-table .st-rank{font-weight:700;color:var(--rosso);width:24px}
.manu-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.manu-filters select{padding:8px 12px;border:1px solid var(--grigio-chiaro);border-radius:6px;font-size:12px;outline:none}
.manu-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.manu-badge.scaduto{background:#FEE2E2;color:#DC2626}
.manu-badge.prossimo{background:#FEF3C7;color:#92400E}
.manu-badge.ok{background:#DCFCE7;color:#15803D}
.manu-cost{font-weight:700;color:var(--rosso)}
.manu-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.manu-summary .ms-card{background:var(--bianco);border:1px solid var(--grigio-chiaro);border-radius:10px;padding:14px;text-align:center}
.manu-summary .ms-value{font-size:24px;font-weight:800;color:var(--nero)}
.manu-summary .ms-label{font-size:10px;color:var(--grigio);text-transform:uppercase;margin-top:2px}
.user-card{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--grigio-chiaro);border-radius:10px;margin-bottom:8px;background:var(--bianco);transition:box-shadow .15s}
.user-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.user-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0}
.user-avatar.admin{background:var(--rosso)}
.user-avatar.operatore{background:var(--grigio-scuro)}
.user-info-card{flex:1}
.user-info-card .uic-name{font-weight:700;font-size:13px;color:var(--nero)}
.user-info-card .uic-user{font-size:11px;color:var(--grigio)}
.user-info-card .uic-role{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-top:2px}
.user-info-card .uic-role.admin{background:#FEE2E2;color:var(--rosso)}
.user-info-card .uic-role.operatore{background:var(--grigio-chiaro);color:var(--grigio-scuro)}
.user-actions{display:flex;gap:6px}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;font-size:12px}
.perm-item{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f9fafb;border-radius:6px}
.perm-item .perm-check{color:var(--verde);font-weight:700}
.perm-item .perm-deny{color:#DC2626;font-weight:700}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:12px;background:var(--bianco);border:1px solid var(--grigio-chiaro);border-radius:10px}
.filter-bar label{font-size:10px;font-weight:600;color:var(--grigio);text-transform:uppercase;margin-right:-4px}
.filter-bar input,.filter-bar select{padding:7px 10px;border:1px solid var(--grigio-chiaro);border-radius:6px;font-size:12px;outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--rosso)}
.filter-bar .filter-reset{background:none;border:none;color:var(--rosso);font-size:11px;cursor:pointer;font-weight:600;padding:7px 10px}
.filter-count{font-size:11px;color:var(--grigio);margin-bottom:8px}
.dark-toggle{background:none;border:1px solid #555;color:#fff;padding:5px 10px;border-radius:6px;font-size:14px;cursor:pointer;transition:all .15s}
.dark-toggle:hover{border-color:var(--rosso);background:rgba(204,20,24,.1)}
.btn-whatsapp{background:#25D366;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:4px}
.btn-whatsapp:hover{background:#1DA851}
.wa-float{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(37,211,102,.4);z-index:50;border:none;transition:transform .15s}
.wa-float:hover{transform:scale(1.1)}
.fatt-totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.fatt-totals .ft-card{background:var(--bianco);border:1px solid var(--grigio-chiaro);border-radius:10px;padding:14px;text-align:center}
.fatt-totals .ft-value{font-size:22px;font-weight:800}
.fatt-totals .ft-label{font-size:10px;color:var(--grigio);text-transform:uppercase;margin-top:2px}
.fatt-print .fp-box{background:#fff;width:700px;max-height:90vh;overflow-y:auto;border-radius:12px;padding:30px}
.fatt-print .fp-header{text-align:center;border-bottom:2px solid var(--rosso);padding-bottom:14px;margin-bottom:14px}
.fatt-print .fp-title{font-size:18px;font-weight:800;margin-top:6px}
.fatt-print .fp-num{font-size:14px;color:var(--rosso);font-weight:700}
.fatt-print .fp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:10px}
.fatt-print .fp-label{font-weight:600;color:var(--grigio-scuro)}
.fatt-print .fp-section{font-size:13px;font-weight:700;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--grigio-chiaro)}
.fatt-print .fp-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.fatt-print .fp-table th{background:#f3f4f6;padding:8px;text-align:left;font-size:10px;text-transform:uppercase}
.fatt-print .fp-table td{padding:8px;border-bottom:1px solid #f3f4f6}
.fatt-print .fp-totale{text-align:right;font-size:14px;margin-top:8px}
.fatt-print .fp-totale .big{font-size:20px;font-weight:800;color:var(--rosso)}
.fatt-print .fp-footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--grigio-chiaro);font-size:10px;color:var(--grigio);text-align:center}
.fatt-print .fp-actions{display:flex;gap:8px;justify-content:center;margin-top:16px}
.btn-email{background:#3B82F6;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:background .15s;display:inline-flex;align-items:center;gap:4px}
.btn-email:hover{background:#2563EB}
.email-preview{background:var(--bianco);border:1px solid var(--grigio-chiaro);border-radius:10px;padding:16px;margin:12px 0;font-size:12px;line-height:1.6}
.email-preview .ep-to{color:var(--grigio);margin-bottom:4px}
.email-preview .ep-subject{font-weight:700;color:var(--nero);margin-bottom:8px;font-size:13px}
.email-preview .ep-body{color:var(--grigio-scuro);white-space:pre-line}
.check-section{margin-bottom:16px}
.check-section h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--nero);display:flex;align-items:center;gap:6px}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f9fafb;border:1px solid var(--grigio-chiaro);border-radius:8px;font-size:12px;cursor:pointer;transition:all .15s}
.check-item:hover{border-color:var(--rosso)}
.check-item.checked{background:#DCFCE7;border-color:#15803D}
.check-item.issue{background:#FEE2E2;border-color:#DC2626}
.check-item .ci-icon{font-size:16px;flex-shrink:0}
.check-item .ci-label{flex:1;font-weight:600}
.check-item .ci-status{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.check-item .ci-status.ok{background:#DCFCE7;color:#15803D}
.check-item .ci-status.problema{background:#FEE2E2;color:#DC2626}
.check-item .ci-status.nd{background:#f3f4f6;color:#6B7280}
.fuel-gauge{display:flex;align-items:center;gap:8px;margin:8px 0}
.fuel-bar{flex:1;height:20px;background:#f3f4f6;border-radius:10px;overflow:hidden}
.fuel-fill{height:100%;border-radius:10px;transition:width .3s}
.fuel-fill.full{background:var(--verde)}
.fuel-fill.half{background:var(--arancio)}
.fuel-fill.low{background:var(--rosso)}
.fuel-label{font-size:12px;font-weight:700;width:40px;text-align:right}
.damage-note{width:100%;padding:8px;border:1px solid var(--grigio-chiaro);border-radius:6px;font-size:12px;resize:vertical;min-height:60px}
.check-summary{background:var(--bianco);border:1px solid var(--grigio-chiaro);border-radius:10px;padding:16px;margin-top:12px}
.check-summary h4{margin-bottom:8px}
.check-summary .cs-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.check-summary .cs-label{color:var(--grigio-scuro)}
.check-summary .cs-value{font-weight:700}
body.dark{background:#121212;color:#E0E0E0}

<script>
// ===== CONFIG =====
var API_BASE='/.netlify/functions/api';
var currentUser=null;
var token=localStorage.getItem('bestrent-token');

function api(method,path,body){
  var opts={method:method,headers:{'Content-Type':'application/json'}};
  if(token)opts.headers['Authorization']='Bearer '+token;
  if(body)opts.body=JSON.stringify(body);
  return fetch(API_BASE+path,opts).then(function(r){return r.json();});
}

// ===== LOGIN =====
document.getElementById('btn-login').addEventListener('click',function(){
  var u=document.getElementById('login-user').value;
  var p=document.getElementById('login-pass').value;
  var errEl=document.getElementById('login-error');
  if(!u||!p){errEl.textContent='Inserisci username e password';errEl.classList.remove('hidden');errEl.classList.add('show');return;}
  api('POST','/auth/login',{username:u,password:p}).then(function(r){
    if(r.token){
      token=r.token;
      currentUser=r.operatore;
      localStorage.setItem('bestrent-token',token);
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      document.getElementById('user-name').textContent=currentUser.nome;
      document.getElementById('user-role').textContent=(currentUser.ruolo||'operatore').toUpperCase();
      loadDashboard();
      loadNotifiche();
    } else {
      errEl.textContent=r.error||'Credenziali non valide';
      errEl.classList.remove('hidden');
      errEl.classList.add('show');
    }
  }).catch(function(){
    errEl.textContent='Errore di connessione al server';
    errEl.classList.remove('hidden');
    errEl.classList.add('show');
  });
});

// ===== LOGOUT =====
function logout(){
  token=null;currentUser=null;
  localStorage.removeItem('bestrent-token');
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

// ===== AUTO LOGIN =====
if(token){
  api('GET','/operatori').then(function(d){
    var list=Array.isArray(d)?d:(d.dati||[]);
    if(list.length>0){
      currentUser=list[0];
      document.getElementById('login-screen').style.display='none';
      document.getElementById('app').style.display='block';
      document.getElementById('user-name').textContent=currentUser.nome;
      document.getElementById('user-role').textContent=(currentUser.ruolo||'operatore').toUpperCase();
      loadDashboard();
      loadNotifiche();
    }
  }).catch(function(){});
}

// ===== NAVIGATION =====
document.querySelectorAll('.nav button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    loadTab(b.getAttribute('data-tab'));
  });
});

function loadTab(t){
  var el=document.getElementById('content');
  el.innerHTML='<p style="text-align:center;padding:40px;color:var(--grigio)">Caricamento...</p>';
  if(t==='dashboard')loadDashboard();
  else if(t==='contratti')loadContratti();
  else if(t==='clienti')loadClienti();
  else if(t==='veicoli')loadVeicoli();
  else if(t==='pagamenti')loadPagamenti();
  else if(t==='penali')loadPenali();
  else if(t==='calendario')loadCalendario();
  else if(t==='statistiche')loadStatistiche();
  else if(t==='manutenzione')loadManutenzione();
  else if(t==='operatori')loadOperatori();
  else if(t==='fatture')loadFatture();
}

// ===== NOTIFICHE =====
function toggleNotif(){
  document.getElementById('notif-panel').classList.toggle('open');
}
function loadNotifiche(){
  api('GET','/contratti').then(function(d){
    var list=d.dati||[];
    var notifs=[];
    var oggi=new Date();
    list.forEach(function(c){
      if(c.data_rientro_prevista){
        var dr=new Date(c.data_rientro_prevista);
        var diff=Math.ceil((dr-oggi)/(1000*60*60*24));
        if(diff<0)notifs.push({tipo:'urgent',titolo:'RIENTRO SCADUTO',dettaglio:c.numero_contratto+' - '+(c.cliente?c.cliente.cognome_nome:'-')+' ('+Math.abs(diff)+' giorni fa)'});
        else if(diff<=3)notifs.push({tipo:'warning',titolo:'Rientro imminente',dettaglio:c.numero_contratto+' - '+(c.cliente?c.cliente.cognome_nome:'-')+' (tra '+diff+' giorni)'});
      }
    });
    document.getElementById('notif-count').textContent=notifs.length;
    var h='<h4>Notifiche ('+notifs.length+')</h4>';
    if(notifs.length>0){
      notifs.forEach(function(n){h+='<div class="notif-item '+n.tipo+'"><div class="ni-title">'+n.titolo+'</div><div class="ni-detail">'+n.dettaglio+'</div></div>';});
    } else {
      h+='<div class="notif-empty">Nessuna notifica</div>';
    }
    document.getElementById('notif-panel').innerHTML=h;
  });
}


// ===== DASHBOARD =====
function loadDashboard(){
  Promise.all([api('GET','/contratti'),api('GET','/clienti'),api('GET','/veicoli'),api('GET','/pagamenti')]).then(function(res){
    var contratti=res[0].dati||[];
    var clienti=res[1].dati||[];
    var veicoli=Array.isArray(res[2])?res[2]:(res[2].dati||[]);
    var pagamenti=Array.isArray(res[3])?res[3]:(res[3].dati||[]);
    var attivi=contratti.filter(function(c){return c.stato_contratto==='attivo';}).length;
    var totFatturato=0;
    pagamenti.forEach(function(p){totFatturato+=Number(p.importo||0);});
    var disponibili=veicoli.filter(function(v){return v.stato==='disponibile';}).length;
    var h='<div class="card"><h3>Dashboard BestRent</h3>';
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px">';
    h+='<div class="alert-card"><div class="alert-title" style="font-size:28px;font-weight:800;color:var(--rosso)">'+contratti.length+'</div><div class="alert-detail">Contratti Totali</div></div>';
    h+='<div class="alert-card"><div class="alert-title" style="font-size:28px;font-weight:800;color:var(--verde)">'+attivi+'</div><div class="alert-detail">Contratti Attivi</div></div>';
    h+='<div class="alert-card"><div class="alert-title" style="font-size:28px;font-weight:800;color:var(--nero)">'+clienti.length+'</div><div class="alert-detail">Clienti</div></div>';
    h+='<div class="alert-card"><div class="alert-title" style="font-size:28px;font-weight:800;color:var(--arancio)">'+veicoli.length+'</div><div class="alert-detail">Veicoli ('+disponibili+' disponibili)</div></div>';
    h+='<div class="alert-card"><div class="alert-title" style="font-size:28px;font-weight:800;color:var(--verde)">&euro;'+totFatturato.toFixed(2)+'</div><div class="alert-detail">Fatturato Totale</div></div>';
    h+='</div></div>';
    // Alerts
    var oggi=new Date();
    var alerts=[];
    contratti.forEach(function(c){
      if(c.data_rientro_prevista){
        var dr=new Date(c.data_rientro_prevista);
        var diff=Math.ceil((dr-oggi)/(1000*60*60*24));
        if(diff<0)alerts.push({tipo:'danger',titolo:'RIENTRO SCADUTO: '+c.numero_contratto,dettaglio:(c.cliente?c.cliente.cognome_nome:'-')+' - scaduto da '+Math.abs(diff)+' giorni'});
        else if(diff<=3)alerts.push({tipo:'warning',titolo:'Rientro imminente: '+c.numero_contratto,dettaglio:(c.cliente?c.cliente.cognome_nome:'-')+' - tra '+diff+' giorni'});
      }
    });
    if(alerts.length>0){
      h+='<div class="card"><h3>Avvisi</h3>';
      alerts.forEach(function(a){h+='<div class="alert-card '+a.tipo+'"><div class="alert-title">'+a.titolo+'</div><div class="alert-detail">'+a.dettaglio+'</div></div>';});
      h+='</div>';
    }
    document.getElementById('content').innerHTML=h;
  });
}

// ===== CONTRATTI =====
function loadContratti(){
  api('GET','/contratti').then(function(d){
    var list=d.dati||[];
    var h='<div class="toolbar"><div class="toolbar-btns"><button class="btn btn-primary btn-sm" onclick="showNewContratto()">+ Nuovo Contratto</button><button class="btn btn-secondary btn-sm" onclick="exportCSVlocal(\'contratti\')">Export CSV</button></div></div>';
    h+='<div class="filter-bar"><label>Stato</label><select id="fc-stato" onchange="filterContratti()"><option value="">Tutti</option><option value="attivo">Attivo</option><option value="chiuso">Chiuso</option></select><label>Dal</label><input id="fc-dal" type="date" onchange="filterContratti()"><label>Al</label><input id="fc-al" type="date" onchange="filterContratti()"><label>Min &euro;</label><input id="fc-min" type="number" placeholder="0" style="width:80px" onchange="filterContratti()"><label>Max &euro;</label><input id="fc-max" type="number" placeholder="9999" style="width:80px" onchange="filterContratti()"><button class="filter-reset" onclick="resetFilterContratti()">Reset filtri</button></div><div class="filter-count" id="fc-count"></div>';
    h+='<div class="card"><table><thead><tr><th>N.</th><th>Cliente</th><th>Veicolo</th><th>Consegna</th><th>Rientro</th><th>Totale</th><th>Stato</th><th>Azioni</th></tr></thead><tbody id="contratti-tbody">';
    list.forEach(function(c){
      var dc=c.data_consegna?new Date(c.data_consegna).toLocaleDateString('it-IT'):'';
      var dr=c.data_rientro_prevista?new Date(c.data_rientro_prevista).toLocaleDateString('it-IT'):'';
      h+='<tr data-stato="'+c.stato_contratto+'" data-data="'+(c.data_consegna||'')+'" data-totale="'+Number(c.totale_documento||0)+'">';
      h+='<td><strong>'+c.numero_contratto+'</strong></td><td>'+(c.cliente?c.cliente.cognome_nome:'-')+'</td><td>'+(c.veicolo?c.veicolo.targa:'-')+'</td><td>'+dc+'</td><td>'+dr+'</td><td>&euro;'+Number(c.totale_documento||0).toFixed(2)+'</td><td><span class="status '+c.stato_contratto+'">'+c.stato_contratto+'</span></td>';
      h+='<td><button class="btn btn-sm" style="background:#8B5CF6;color:#fff" onclick="showChecklist('+c.id+',\'consegna\')">Consegna</button> <button class="btn btn-sm" style="background:#EC4899;color:#fff" onclick="showChecklist('+c.id+',\'rientro\')">Rientro</button> <button class="btn-email btn-sm" onclick="sendEmailConferma('+c.id+')">Email</button> <button class="btn btn-warning btn-sm" onclick="printContratto('+c.id+')">PDF</button> <button class="btn btn-danger btn-sm" onclick="deleteContratto('+c.id+')">Elimina</button></td></tr>';
    });
    h+='</tbody></table></div>';
    document.getElementById('content').innerHTML=h;
  });
}

function showNewContratto(){
  Promise.all([api('GET','/clienti'),api('GET','/veicoli')]).then(function(res){
    var clienti=res[0].dati||[];
    var veicoli=Array.isArray(res[1])?res[1]:(res[1].dati||[]);
    var h='<div class="modal-overlay" onclick="closeModal()"><div class="modal-box" onclick="event.stopPropagation()">';
    h+='<h3>Nuovo Contratto</h3>';
    h+='<div class="form-row"><div class="form-group"><label>N. Contratto *</label><input id="m-nc" placeholder="Es: M166"></div><div class="form-group"><label>Cliente *</label><select id="m-cl"><option value="">Seleziona...</option>';
    clienti.forEach(function(c){h+='<option value="'+c.id+'">'+c.cognome_nome+'</option>';});
    h+='</select></div></div>';
    h+='<div class="form-row"><div class="form-group"><label>Veicolo *</label><select id="m-ve"><option value="">Seleziona...</option>';
    veicoli.forEach(function(v){h+='<option value="'+v.id+'">'+v.targa+' - '+v.marca+' '+v.modello+'</option>';});
    h+='</select></div><div class="form-group"><label>Sede</label><input id="m-sede" value="Gallarate MXP"></div></div>';
    h+='<div class="form-row"><div class="form-group"><label>Data Consegna</label><input id="m-dc" type="datetime-local"></div><div class="form-group"><label>Data Rientro</label><input id="m-dr" type="datetime-local"></div></div>';
    h+='<div class="form-row"><div class="form-group"><label>Tariffa/giorno (&euro;)</label><input id="m-tg" type="number" value="45"></div><div class="form-group"><label>Giorni</label><input id="m-gg" type="number" value="1"></div></div>';
    h+='<div class="form-row"><div class="form-group"><label>Sconto %</label><input id="m-sc" type="number" value="0"></div><div class="form-group"><label>Deposito (&euro;)</label><input id="m-dep" type="number" value="700"></div></div>';
    h+='<div class="form-group"><label>Note</label><textarea id="m-note" rows="2"></textarea></div>';
    h+='<div class="modal-actions"><button class="btn btn-secondary btn-sm" onclick="closeModal()">Annulla</button><button class="btn btn-primary btn-sm" onclick="saveContratto()">Crea Contratto</button></div>';
    h+='</div></div>';
    document.getElementById('modal').innerHTML=h;
    document.getElementById('modal').classList.remove('hidden');
  });
}

function saveContratto(){
  var nc=document.getElementById('m-nc').value;
  var cl=document.getElementById('m-cl').value;
  var ve=document.getElementById('m-ve').value;
  if(!nc||!cl||!ve){alert('Compila i campi obbligatori!');return;}
  var tg=parseFloat(document.getElementById('m-tg').value)||45;
  var gg=parseInt(document.getElementById('m-gg').value)||1;
  var sc=parseFloat(document.getElementById('m-sc').value)||0;
  var totale=tg*gg*(1-sc/100);
  var data={
    numero_contratto:nc,id_cliente:parseInt(cl),id_veicolo:parseInt(ve),
    sede_noleggio:document.getElementById('m-sede').value,
    data_consegna:document.getElementById('m-dc').value||new Date().toISOString(),
    data_rientro_prevista:document.getElementById('m-dr').value||new Date().toISOString(),
    tariffa_giornaliera:tg,giorni_noleggio:gg,sconto_percentuale:sc,
    totale_documento:totale,deposito_cauzionale:parseFloat(document.getElementById('m-dep').value)||0,
    note:document.getElementById('m-note').value
  };
  api('POST','/contratti',data).then(function(r){
    if(r.error){alert(r.error);}else{closeModal();loadContratti();}
  });
}

function deleteContratto(id){
  if(confirm('Eliminare questo contratto?')){
    api('DELETE','/contratti/'+id).then(function(){loadContratti();});
  }
}

function printContratto(id){
  api('GET','/contratti/'+id).then(function(c){
    if(!c||c.error){alert('Contratto non trovato');return;}
    var cl=c.cliente||{};var ve=c.veicolo||{};
    var dc=c.data_consegna?new Date(c.data_consegna).toLocaleDateString('it-IT'):'';
    var dr=c.data_rientro_prevista?new Date(c.data_rientro_prevista).toLocaleDateString('it-IT'):'';

var calMonth=new Date().getMonth();

function loadCalendario(){
  api('GET','/contratti').then(function(d){
    var list=d.dati||[];
    var h='<div class="cal-header"><div class="cal-nav"><button onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}loadCalendario();">&larr;</button></div><h3>'+['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'][calMonth]+' '+calYear+'</h3><div class="cal-nav"><button onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}loadCalendario();">&rarr;</button></div></div>';
    var giorni=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
    h+='<div class="cal-grid">';
    giorni.forEach(function(g){h+='<div class="cal-day-header">'+g+'</div>';});
    var primo=new Date(calYear,calMonth,1);
    var ultimoGiorno=new Date(calYear,calMonth+1,0).getDate();
    var startDay=(primo.getDay()+6)%7;
    var oggi=new Date();
    for(var i=0;i<startDay;i++){h+='<div class="cal-day other-month"></div>';}
    for(var d2=1;d2<=ultimoGiorno;d2++){
      var isToday=d2===oggi.getDate()&&calMonth===oggi.getMonth()&&calYear===oggi.getFullYear();
      h+='<div class="cal-day'+(isToday?' today':'')+'"><div class="day-num">'+d2+'</div>';
      var dataStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
      list.forEach(function(c){
        if(c.data_consegna&&c.data_consegna.substring(0,10)===dataStr){h+='<div class="cal-event consegna" title="Consegna: '+c.numero_contratto+'">C: '+c.numero_contratto+'</div>';}
        if(c.data_rientro_prevista&&c.data_rientro_prevista.substring(0,10)===dataStr){h+='<div class="cal-event rientro" title="Rientro: '+c.numero_contratto+'">R: '+c.numero_contratto+'</div>';}
      });
      h+='</div>';
    }
    h+='</div>';
    h+='<div class="cal-legend"><span><span class="dot" style="background:#DCFCE7"></span> Consegna</span><span><span class="dot" style="background:#FEE2E2"></span> Rientro</span></div>';
    document.getElementById('content').innerHTML=h;
  });
}

// ===== STATISTICHE =====
function loadStatistiche(){
  Promise.all([api('GET','/contratti'),api('GET','/clienti'),api('GET','/veicoli'),api('GET','/pagamenti')]).then(function(res){
    var contratti=res[0].dati||[];
    var clienti=res[1].dati||[];
    var veicoli=Array.isArray(res[2])?res[2]:(res[2].dati||[]);
    var pagamenti=Array.isArray(res[3])?res[3]:(res[3].dati||[]);
    var totFatturato=0;pagamenti.forEach(function(p){totFatturato+=Number(p.importo||0);});
    var attivi=contratti.filter(function(c){return c.stato_contratto==='attivo';}).length;
    var chiusi=contratti.filter(function(c){return c.stato_contratto==='chiuso';}).length;
    var disponibili=veicoli.filter(function(v){return v.stato==='disponibile';}).length;
    var noleggiati=veicoli.filter(function(v){return v.stato==='noleggiato';}).length;
    var inManu=veicoli.filter(function(v){return v.stato==='manutenzione';}).length;
    var maxC=Math.max(attivi,chiusi,1);
    var maxV=Math.max(disponibili,noleggiati,inManu,1);
    var h='<div class="stats-grid">';
    h+='<div class="stat-card"><h4>Contratti per Stato</h4>';
    h+='<div class="chart-bar"><span class="cb-label">Attivi</span><div class="cb-track"><div class="cb-fill verde" style="width:'+Math.round(attivi/maxC*100)+'%">'+attivi+'</div></div><span class="cb-value">'+attivi+'</span></div>';
    h+='<div class="chart-bar"><span class="cb-label">Chiusi</span><div class="cb-track"><div class="cb-fill rosso" style="width:'+Math.round(chiusi/maxC*100)+'%">'+chiusi+'</div></div><span class="cb-value">'+chiusi+'</span></div>';
    h+='</div>';
    h+='<div class="stat-card"><h4>Flotta per Stato</h4>';

function generaFatturaDaContratto(numContratto,cliente,totale){
  var imponibile=Math.round(totale/1.22*100)/100;
  var iva=Math.round((totale-imponibile)*100)/100;
  var oggi=new Date().toLocaleDateString('it-IT');
  var numFatt='FT-'+String(nextNumFattura).padStart(4,'0')+'/'+new Date().getFullYear();
  fattureLocali.push({numero:numFatt,data:oggi,cliente:cliente,contratto:numContratto,imponibile:imponibile,iva:iva,totale_lordo:totale,aliquota:22});
  nextNumFattura++;
  localStorage.setItem('bestrent-fatture',JSON.stringify(fattureLocali));
  localStorage.setItem('bestrent-next-fatt',nextNumFattura);
  loadFatture();
  alert('Fattura '+numFatt+' generata!');
}

      var csv='Nome,Telefono,Email,Patente,Nazione,Indirizzo\n';
      list.forEach(function(c){csv+='"'+c.cognome_nome+'",'+(c.telefono||'')+','+(c.email||'')+','+(c.patente_nr||'')+','+(c.nazione||'')+','+(c.indirizzo||'')+'\n';});
      downloadCSV(csv,'bestrent_clienti.csv');
    });
  } else if(tipo==='veicoli'){
    api('GET','/veicoli').then(function(d){
      var list=Array.isArray(d)?d:(d.dati||[]);
      var csv='Targa,Marca,Modello,Km,Carburante,Sede,Stato\n';
      list.forEach(function(v){csv+=v.targa+','+v.marca+','+v.modello+','+(v.km_attuali||0)+','+(v.tipo_carburante||'')+','+(v.sede||'')+','+v.stato+'\n';});
      downloadCSV(csv,'bestrent_veicoli.csv');
    });
  } else if(tipo==='pagamenti'){
    api('GET','/pagamenti').then(function(d){
      var list=Array.isArray(d)?d:(d.dati||[]);
      var csv='Data,Tipo,Importo,Deposito,Rimborsato\n';
      list.forEach(function(p){csv+=(p.data_pagamento||'')+','+p.tipo_pagamento+','+Number(p.importo||0)+','+Number(p.deposito_cauzionale||0)+','+(p.rimborsato?'Si':'No')+'\n';});
      downloadCSV(csv,'bestrent_pagamenti.csv');
    });
  }
}

function downloadCSV(csv,filename){
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download=filename;
  link.click();
}

// ===== FILTRI CONTRATTI =====
function filterContratti(){
  var stato=document.getElementById('fc-stato').value;
  var dal=document.getElementById('fc-dal').value;
  var al=document.getElementById('fc-al').value;
  var min=parseFloat(document.getElementById('fc-min').value)||0;
  var max=parseFloat(document.getElementById('fc-max').value)||999999;
  var rows=document.querySelectorAll('#contratti-tbody tr');
  var count=0;
  rows.forEach(function(r){
    var show=true;
    if(stato&&r.getAttribute('data-stato')!==stato)show=false;
    if(dal&&r.getAttribute('data-data')<dal)show=false;
    if(al&&r.getAttribute('data-data')>al)show=false;
    var tot=parseFloat(r.getAttribute('data-totale'))||0;
    if(tot<min||tot>max)show=false;
    r.style.display=show?'':'none';
    if(show)count++;
  });
  document.getElementById('fc-count').textContent='Mostrati: '+count+' contratti';
}

function resetFilterContratti(){
  document.getElementById('fc-stato').value='';
  document.getElementById('fc-dal').value='';
  document.getElementById('fc-al').value='';
  document.getElementById('fc-min').value='';
  document.getElementById('fc-max').value='';
  filterContratti();
}

// ===== FILTRI VEICOLI =====
function filterVeicoli(){
  var stato=document.getElementById('fv-stato').value;
  var carb=document.getElementById('fv-carb').value;
  var search=document.getElementById('fv-search').value.toLowerCase();
  var rows=document.querySelectorAll('#veicoli-tbody tr');
  var count=0;
  rows.forEach(function(r){
    var show=true;
    if(stato&&r.getAttribute('data-stato')!==stato)show=false;
    if(carb&&r.getAttribute('data-carb')!==carb)show=false;
    if(search&&r.textContent.toLowerCase().indexOf(search)===-1)show=false;
    r.style.display=show?'':'none';
    if(show)count++;
  });
  document.getElementById('fv-count').textContent='Mostrati: '+count+' veicoli';
}

function resetFilterVeicoli(){
  document.getElementById('fv-stato').value='';
  document.getElementById('fv-carb').value='';
  document.getElementById('fv-search').value='';
  filterVeicoli();
}

function showEmailPreview(email,subject,body,tipo){
  var h='<div class="modal-overlay" onclick="closeModal()"><div class="modal-box" onclick="event.stopPropagation()">';
  h+='<h3>'+tipo+' - Anteprima Email</h3>';
  h+='<div class="email-preview">';
  h+='<div class="ep-to">A: <strong>'+(email||'email non disponibile')+'</strong></div>';
  h+='<div class="ep-subject">Oggetto: '+subject+'</div>';
  h+='<div class="ep-body">'+body.replace(/\n/g,'<br>')+'</div>';
  h+='</div>';
  h+='<div class="modal-actions">';
  if(email){h+='<button class="btn btn-primary btn-sm" onclick="window.open(\'mailto:'+email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)+'\')">Invia con Email</button>';}
  h+='<button class="btn btn-secondary btn-sm" onclick="copyEmailText(this)" data-body="'+body.replace(/"/g,'&quot;')+'">Copia Testo</button>';
  h+='<button class="btn btn-secondary btn-sm" onclick="closeModal()">Chiudi</button>';
  h+='</div></div></div>';
  document.getElementById('modal').innerHTML=h;
  document.getElementById('modal').classList.remove('hidden');
}

function copyEmailText(btn){
  var text=btn.getAttribute('data-body');
  navigator.clipboard.writeText(text).then(function(){btn.textContent='Copiato!';setTimeout(function(){btn.textContent='Copia Testo';},2000);});
}

function sendWhatsApp(telefono,nome){
  if(!telefono||telefono.length<8){alert('Numero di telefono non disponibile per questo cliente');return;}
  var tel=telefono.replace(/[^0-9]/g,'');
  if(tel.charAt(0)==='0')tel='39'+tel.substring(1);
  if(tel.substring(0,2)!=='39'&&tel.length<11)tel='39'+tel;
  var msg='Gentile '+nome+', la contattiamo da BestRent S.r.l. riguardo il suo noleggio. Per info: +39 3500 300 197';
  window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(msg),'_blank');
}

function toggleCheckItem(id){
  var el=document.getElementById('ck-'+id);
  var st=document.getElementById('ck-st-'+id);
  var current=st.textContent;
  if(current==='N/D'){el.className='check-item checked';st.className='ci-status ok';st.textContent='OK';}
  else if(current==='OK'){el.className='check-item issue';st.className='ci-status problema';st.textContent='PROBLEMA';}
  else{el.className='check-item';st.className='ci-status nd';st.textContent='N/D';}
}

function saveChecklist(numContratto,tipo,idContratto){
  var key=numContratto+'_'+tipo;
  var data={km:document.getElementById('ck-km').value,fuel:document.getElementById('ck-fuel').value,danni:document.getElementById('ck-danni').value,note:document.getElementById('ck-note').value,operatore:document.getElementById('ck-operatore').value,data:document.getElementById('ck-data').value};
  var items=['carrozzeria','pneumatici','finestrini','luci','interni','cruscotto','documenti','chiavi','ruota_scorta','triangolo','navigatore','pulizia'];
  items.forEach(function(id){var st=document.getElementById('ck-st-'+id);if(st)data['item_'+id]=st.textContent==='OK'?'ok':st.textContent==='PROBLEMA'?'problema':'nd';});
  checklistData[key]=data;
  localStorage.setItem('bestrent-checklists',JSON.stringify(checklistData));
  if(data.km){api('PUT','/veicoli/'+idContratto,{km_attuali:parseInt(data.km)});}
  closeModal();
  alert('Checklist '+tipo+' salvata per '+numContratto+'!');
}
